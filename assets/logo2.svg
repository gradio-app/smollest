<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 90">
  <defs>
    <filter id="sketchy">
      <feTurbulence type="turbulence" baseFrequency="0.015" numOctaves="3" seed="2" result="turbulence"/>
      <feDisplacementMap in="SourceGraphic" in2="turbulence" scale="2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <rect x="10" y="8" width="380" height="72" rx="3" ry="3" fill="#fffef8" stroke="#333" stroke-width="2.5" filter="url(#sketchy)"/>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="44" fill="#333" stroke="#333" paint-order="stroke">
    <text x="175" y="60" text-anchor="end"><tspan stroke-width="1.75">s</tspan><tspan stroke-width="1.5">m</tspan></text>
    <text x="203" y="60"><tspan stroke-width="1">l</tspan><tspan stroke-width="0.75">l</tspan><tspan stroke-width="0.5">e</tspan><tspan stroke-width="0.25">s</tspan><tspan stroke-width="0">t</tspan></text>
  </g>
  <g transform="translate(189 48)" stroke="#333" fill="none">
    <circle r="11" stroke-width="2.2"/>
    <g stroke-width="1.2" stroke-linecap="round">
      <line x1="2.4" y1="0" x2="9.7" y2="0"/>
      <line x1="2.4" y1="0" x2="9.7" y2="0" transform="rotate(60)"/>
      <line x1="2.4" y1="0" x2="9.7" y2="0" transform="rotate(120)"/>
      <line x1="2.4" y1="0" x2="9.7" y2="0" transform="rotate(180)"/>
      <line x1="2.4" y1="0" x2="9.7" y2="0" transform="rotate(240)"/>
      <line x1="2.4" y1="0" x2="9.7" y2="0" transform="rotate(300)"/>
    </g>
    <circle r="2.2" fill="#333" stroke="none"/>
  </g>
</svg>
