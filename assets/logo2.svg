<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 90">
  <defs>
    <filter id="sketchy">
      <feTurbulence type="turbulence" baseFrequency="0.015" numOctaves="3" seed="2" result="turbulence"/>
      <feDisplacementMap in="SourceGraphic" in2="turbulence" scale="2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <rect x="10" y="8" width="380" height="72" rx="3" ry="3" fill="#fffef8" stroke="#333" stroke-width="2.5" filter="url(#sketchy)"/>
  <text x="200" y="60" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="44" fill="#333" stroke="#333" paint-order="stroke" text-anchor="middle"><tspan stroke-width="1.75">s</tspan><tspan stroke-width="1.5">m</tspan><tspan stroke-width="1.25">o</tspan><tspan stroke-width="1">l</tspan><tspan stroke-width="0.75">l</tspan><tspan stroke-width="0.5">e</tspan><tspan stroke-width="0.25">s</tspan><tspan stroke-width="0">t</tspan></text>
</svg>
