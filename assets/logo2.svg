<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 90">
  <defs>
    <filter id="sketchy">
      <feTurbulence type="turbulence" baseFrequency="0.015" numOctaves="3" seed="2" result="turbulence"/>
      <feDisplacementMap in="SourceGraphic" in2="turbulence" scale="2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <rect x="10" y="8" width="380" height="72" rx="3" ry="3" fill="#fffef8" stroke="#333" stroke-width="2.5" filter="url(#sketchy)"/>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="44" fill="#333" stroke="#333" paint-order="stroke">
    <text x="176" y="60" text-anchor="end"><tspan stroke-width="1.75">s</tspan><tspan stroke-width="1.5">m</tspan></text>
    <text x="189" y="60" text-anchor="middle"><tspan stroke-width="1.25">o</tspan></text>
    <text x="202" y="60"><tspan stroke-width="1">l</tspan><tspan stroke-width="0.75">l</tspan><tspan stroke-width="0.5">e</tspan><tspan stroke-width="0.25">s</tspan><tspan stroke-width="0">t</tspan></text>
  </g>
  <g transform="translate(189 48.5)" fill="#333">
    <circle cx="14" cy="0" r="2" transform="rotate(30)"/>
    <circle cx="14" cy="0" r="2" transform="rotate(90)"/>
    <circle cx="14" cy="0" r="2" transform="rotate(150)"/>
    <circle cx="14" cy="0" r="2" transform="rotate(210)"/>
    <circle cx="14" cy="0" r="2" transform="rotate(270)"/>
    <circle cx="14" cy="0" r="2" transform="rotate(330)"/>
  </g>
</svg>
